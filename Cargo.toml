[package]
name = "aria-mobile-core"
version = "0.1.0"
edition = "2021"
authors = ["5060 Solutions <josh@5060solutions.com>"]
description = "Shared Rust core for Aria mobile softphone apps (iOS/Android)"
license = "LicenseRef-Proprietary"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "aria_mobile_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[features]
default = []
# On-device transcription and summarisation.
#
# aria-ai-core is depended on here, rather than shipped as a second UniFFI
# library, so that call audio never crosses the FFI boundary: the RTP threads in
# media.rs already hold the decoded PCM and hand it straight to the tap. The
# alternative — surfacing frames to Kotlin/Swift and pushing them back — would
# cross the boundary about a hundred times a second per call.
#
# Off by default: it pulls in whisper.cpp, a slow C++ build that a host not
# shipping AI should not pay for.
ai = ["dep:aria-ai-core", "aria-ai-core/stt-whisper"]

# On-device summarisation, on top of `ai`.
#
# Separate from `ai` because it does not work yet: whisper.cpp and llama.cpp each
# vendor their own copy of ggml, and linking both into one binary collides
# (`duplicate symbol: ggml_backend_buffer_set_usage`). On iOS the archive builds
# and the clash is deferred to Xcode's final link, which is worse. The fix is to
# build one shared ggml via WHISPER_USE_SYSTEM_GGML / LLAMA_USE_SYSTEM_GGML —
# verified feasible, but it needs patched -sys crates. See
# aria-ai-core/docs/mobile-integration.md.
#
# Until that lands this feature will not link on Android and will misbehave on
# iOS. Transcription via `ai` alone is unaffected.
ai-summaries = ["ai", "aria-ai-core/llm-llama"]

[dependencies]
# UniFFI for Swift/Kotlin bindings
uniffi = { version = "0.28", features = ["cli"] }

# Optional on-device AI. `default-features = false` keeps its HTTP stack and
# SQLite out unless a host asks for them; the mobile hosts enable what they need
# via the `ai-*` features below.
aria-ai-core = { path = "../aria-ai-core", optional = true, default-features = false, features = [
    "net",
    "disk-space",
    "insights",
] }

# Shared SIP utilities
sip-5060 = { git = "https://github.com/5060-Solutions/5060-sip.git" }

# RTP media engine (no device feature on mobile — we use platform audio)
rtp-engine = { git = "https://github.com/5060-Solutions/rtp-engine.git", default-features = false, features = ["g711", "opus", "srtp"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }

# HTTP client for gateway API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Streaming response bodies with a size cap (prevents OOM from a hostile gateway)
futures-util = { version = "0.3", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# DNS SRV resolution
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
log = "0.4"
android_logger = "0.14"
thiserror = "2"
once_cell = "1"
rand = "0.9"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
